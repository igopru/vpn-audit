<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Вход — VPN Audit</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; }
    </style>
</head>
<body>
<div class="card login-card shadow">
    <div class="card-body">
        <h4 class="text-center mb-4">🔐 VPN Audit</h4>
        
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="hidden" name="next" value="{{ next }}">
            
            <div class="mb-3">
                <label class="form-label">Логин (sAMAccountName)</label>
                <input type="text" name="username" class="form-control" required autofocus placeholder="ivanovii">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        
        <div class="mt-3 text-center text-muted small">
            Доступ предоставляется администратором.<br>
            Для получения доступа обратитесь в Службу ИТ.
        </div>
    </div>
</div>
</body>
</html>
